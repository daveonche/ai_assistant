# Switch with /model architect
- name: openrouter/z-ai/glm-5.3-flash
  edit_format: diff
  extra_params:
    extra_body:
      provider:
        # Forces OpenRouter to strictly select the lowest-cost candidate endpoint
        sort: "price"
        # Forces OpenRouter to exclusively use this provider
        # only: ["DeepInfra"]
        # Disables high-cost safety fallback routes if the cheap host fails
        allow_fallbacks: true
        # Denies providers from logging your code data for training metrics
        data_collection: "deny"

