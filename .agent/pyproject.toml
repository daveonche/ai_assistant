[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Launch an AI assistant in Docker"
requires-python = ">=3.8"
dependencies = [
    "pytest==8.3.5",
]

[project.scripts]
ai-assistant = "ai_assistant:main"

[tool.setuptools]
py-modules = ["ai_assistant"]
