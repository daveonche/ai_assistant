# CI pipeline validating the launcher, shell scripts, the Docker image
# build, and release-tag consistency.
#
# Local validation: actionlint is the preferred validator (see
# .agent/.aider.conventions/references/ci-cd-best-practices.md). When it is
# not installed, validate YAML syntax with PyYAML:
#   python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('YAML OK')"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate launcher and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history is genuinely required here: the commit-subject
          # stage walks every commit a push introduces (before..after),
          # which a shallow checkout cannot resolve.
          fetch-depth: 0
          persist-credentials: false

      - name: Python syntax check of launcher
        run: python3 -m py_compile .agent/ai_assistant.py

      - name: Shellcheck shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      # The gate must catch a non-conforming subject even when it is
      # buried under later commits (e.g. committed with --no-verify), so
      # a push validates every commit it introduces, not only the tip.
      # On pull_request events the checked-out tip is a merge commit,
      # which the hook exempts, so only the tip is checked there.
      - name: Validate commit subjects with the commit-msg hook
        run: |
          set -euo pipefail
          validate_tip() {
            git --no-pager log -1 --format=%s > "$RUNNER_TEMP/subject.txt"
            bash .githooks/commit-msg "$RUNNER_TEMP/subject.txt"
          }
          if [[ "${{ github.event_name }}" != "push" ]]; then
            validate_tip
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            # New branch: no base commit exists; validate the tip.
            validate_tip
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "::error::push base ${before} is not in the checked-out history (force push?); cannot validate the pushed range"
            exit 1
          fi
          commits="$(git rev-list "${before}..${{ github.event.after }}")"
          status=0
          while IFS= read -r commit; do
            git --no-pager log -1 --format=%s "$commit" > "$RUNNER_TEMP/subject.txt"
            if ! bash .githooks/commit-msg "$RUNNER_TEMP/subject.txt"; then
              echo "::error::commit ${commit}: subject rejected by the commit-msg gate"
              status=1
            fi
          done <<< "$commits"
          exit "$status"

  docker-build:
    name: Docker image build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build image from .agent/Dockerfile.aider
        run: docker build --progress=plain -f .agent/Dockerfile.aider -t ai-assistant:ci .agent
        env:
          DOCKER_BUILDKIT: "1"

  release-tag-guard:
    name: Release tag matches DEFAULT_REF
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the tag equals DEFAULT_REF in scripts/install.sh
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          default_ref="$(sed -n 's/^readonly DEFAULT_REF="\(.*\)"$/\1/p' scripts/install.sh)"
          if [[ -z "${default_ref}" ]]; then
            echo "::error::could not read DEFAULT_REF from scripts/install.sh"
            exit 1
          fi
          if [[ "${default_ref}" != "${tag}" ]]; then
            echo "::error::tag ${tag} does not match DEFAULT_REF ${default_ref}; bump the pinned reference (scripts/install.sh, README.md, tests/test_s2_1_step5.py) and re-tag"
            exit 1
          fi
          echo "release pin OK: tag ${tag} == DEFAULT_REF ${default_ref}"
