# CI pipeline validating the launcher, shell scripts, and Docker image build.
#
# Local validation: actionlint is the preferred validator (see
# .agent/.aider.conventions/references/ci-cid-best-practices.md). When it is
# not installed, validate YAML syntax with PyYAML:
#   python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('YAML OK')"

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - '.agent/**'
      - 'agent.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.agent/**'
      - 'agent.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate launcher and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Python syntax check of launcher
        run: python3 -m py_compile .agent/ai_assistant.py

      - name: Shellcheck shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  docker-build:
    name: Docker image build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Build image from .agent/Dockerfile.aider
        run: docker build -f .agent/Dockerfile.aider -t ai-assistant:ci .
